          type: string
        lastName:
          type: string
        firstName:
          type: string
        profilePic:
          type: string
        roleId:
          type: integer
          format: int64
    Notification:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        message:
          type: string
        sentBy:
          type: string
        departmentId:
          type: integer
          format: int64
        sendersUsername:
          type: string
        sendersProfilePic:
          type: string
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        fileName:
          type: string
        contentType:
          type: string
        size:
          type: integer
          format: int64
        fileUrl:
          type: string
        noticeId:
          type: integer
          format: int64
    ApiPermission:
      type: object
      properties:
        id:
          type: integer
          format: int64
        apiUrl:
          type: string
        httpMethod:
          type: string
    NotificationUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
        notificationId:
          type: integer
          format: int64
        username:
          type: string
        read:
          type: boolean
    NoticeReadDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        noticeId:
          type: integer
          format: int64
        studentId:
          type: integer
          format: int64
        teacherId:
          type: integer
          format: int64
        readAt:
          type: string
          format: date-time
    ApiResponse:
      type: object
      properties:
        message:
          type: string
        status:
          type: boolean
  securitySchemes:
