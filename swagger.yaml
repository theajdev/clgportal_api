          type: string
          maxLength: 100
          minLength: 4
        lastName:
          type: string
          maxLength: 100
          minLength: 4
        middleName:
          type: string
        username:
          type: string
        mobileNo:
          type: integer
          format: int64
          maximum: 9999999999
          minimum: 1000000000
        address:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$
        profilePic:
          type: string
        status:
          type: string
        designation:
          type: string
        about:
          type: string
        postedOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
        deptId:
          type: integer
          format: int64
      required:
      - mobileNo
      - status
    ChangePasswordRequest:
      type: object
      properties:
        email:
          type: string
        currentPassword:
          type: string
        newPassword:
          type: string
        confirmPassword:
          type: string
    DeleteRequestDto:
      type: object
      properties:
        module:
          type: string
          enum:
          - ADMIN
          - TEACHER
          - STUDENT
          - DEPARTMENT
          - ROLE
          - SUBJECT
          - NOTICE
        ids:
          type: array
          items:
            type: integer
            format: int64
    DeleteSelectedIdsResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        message:
          type: string
    NoticeReply:
      type: object
      properties:
        id:
          type: integer
          format: int64
        message:
          type: string
        repliedBy:
          type: string
        username:
          type: string
        profilePic:
          type: string
        designation:
          type: string
        repliedOn:
          type: string
          format: date-time
    LoginDto:
      type: object
      properties:
        usernameOrEmail:
          type: string
        password:
          type: string
        authority:
          type: string
    RoleDetailProjection:
      type: object
