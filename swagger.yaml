components:
  schemas:
    YearsDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        yearDesc:
          type: string
        status:
          type: string
    TeacherDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
          maxLength: 100
          minLength: 4
        middleName:
          type: string
        lastName:
          type: string
          maxLength: 100
          minLength: 4
        mobileNo:
          type: integer
          format: int64
          maximum: 9999999999
          minimum: 1000000000
        address:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$
        profilePic:
          type: string
        status:
          type: string
        designation:
          type: string
        about:
          type: string
        postedOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
        deptId:
          type: integer
          format: int64
      required:
      - mobileNo
      - status
    SubjectDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        subject:
          type: string
        status:
          type: string
    StudentDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
          maxLength: 100
          minLength: 4
        middleName:
          type: string
        lastName:
          type: string
          maxLength: 100
          minLength: 4
        mobileNo:
          type: integer
          format: int64
          maximum: 9999999999
          minimum: 1000000000
        address:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$
        guardianName:
          type: string
        profilePic:
          type: string
        status:
          type: string
        about:
          type: string
        postedOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
        teacher:
          $ref: '#/components/schemas/TeacherDto'
        deptId:
          type: integer
          format: int64
      required:
      - mobileNo
      - status
    RoleDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        roleName:
          type: string
          maxLength: 20
          minLength: 4
        roleDisp:
          type: string
        isActive:
          type: boolean
      required:
      - roleName
    PermissionDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        apiUrl:
          type: string
        httpMethod:
          type: string
        selected:
          type: boolean
    AttachmentDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        fileName:
          type: string
        fileUrl:
          type: string
    NoticeDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        noticeTitle:
          type: string
        noticeDesc:
          type: string
        sendersUsername:
          type: string
        sendersProfilePic:
          type: string
        sentBy:
          type: string
        status:
          type: string
        deptId:
          type: array
          items:
            type: integer
            format: int64
        postedOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
        isRead:
          type: string
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentDto'
    GuardianNoticeDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        creationDate:
          type: string
          format: date-time
        noticeDesc:
          type: string
        noticeTitle:
          type: string
        status:
          type: string
        studentId:
          type: integer
          format: int64
        teacherId:
          type: integer
          format: int64
    DepartmentDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        deptDesc:
          type: string
        status:
          type: string
        student:
          $ref: '#/components/schemas/StudentDto'
        teacher:
          $ref: '#/components/schemas/TeacherDto'
    AdminDto:
