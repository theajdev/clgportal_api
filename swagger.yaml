openapi: 3.0.3

info:
  title: College Portal API
  description: REST APIs for the College Portal application.
  version: "1.0"
  contact:
    name: AjTechSoft
    email: asksoftwares1@gmail.com
    url: https://ajtechsoft.qzz.io

# IMPORTANT:
# Replace the URL below with your publicly deployed Spring Boot backend URL.
# Example:
#   https://api.example.com
servers:
  - url: https://theajdev.github.io
    description: Production server
  - url: http://localhost:2025
    description: Local development server

security:
  - bearerAuth: []

tags:
  - name: Authentication
  - name: Admin
  - name: Teacher
  - name: Student
  - name: Department
  - name: Subject
  - name: Role
  - name: Years
  - name: Notice
  - name: Notice Replies
  - name: Notifications
  - name: Permissions
  - name: User

paths:

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwtAuthResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Logout
      responses:
        '200':
          description: Logged out successfully
          content:
            text/plain:
              schema:
                type: string

